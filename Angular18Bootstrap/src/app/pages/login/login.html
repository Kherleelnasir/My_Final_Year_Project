<div class="login-container">

  <div class="login-header">
    <h1>User Login</h1>
    <p>Login to access your account</p>
  </div>

  <form novalidate>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email address"
        required
      >
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
        required
      >
    </div>

    <!-- Remember / Forgot Password -->
    <div class="remember">
      <label class="remember-label">
        <input
          type="checkbox"
          id="remember"
          name="remember"
        >
        <span>Remember me</span>
      </label>

      <a class="forgot-password" href="#forgot-password">
        Forgot Password?
      </a>
    </div>

    <!-- Error Message -->
    <p
      *ngIf="errorMessage"
      class="error-message"
    >
      {{ errorMessage }}
    </p>

    <!-- Login Button -->
    <button
      class="submit"
      type="button"
      (click)="login()"
    >
      Login
    </button>

    <!-- Sign Up -->
    <div class="signup">
      <div class="or">
        <span>or</span>
      </div>

      <p>
        Don't have an account?
        <a
          class="signup-link"
          [routerLink]="['/signup']"
        >
          Sign Up
        </a>
      </p>
    </div>

  </form>

</div>
